[package]
name = "todo-rust-cli"
author = ["Darix SAMANI SIEWE <samanidarix@gmail.com>"]
version = "0.1.0"
edition = "2024"
description = "Rust-powered command-line todo manager with JSON persistence"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"


[[bin]]
name = "todo"
path = "src/main.rs"
